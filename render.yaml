services:
  - type: web
    name: wellwith-crm
    env: node
    plan: starter
    region: oregon
    buildCommand: npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        value: "file:./dev.db"
